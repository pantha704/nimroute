services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in nimroute.env}
      POSTGRES_DB: litellm
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [nimroute]

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [nimroute]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4100", "--num_workers", "1"]
    env_file: nimroute.env
    environment:
      LITELLM_TELEMETRY: "False"
      # DB-backed (spend + teams/keys) — this is what the in-memory nim-router lacks
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      REDIS_URL: redis://redis:6379
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # litellm image has no curl; use python's urllib
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://localhost:4100/health/liveliness',timeout=5)"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks: [nimroute]

  console:
    build:
      context: ./console
    env_file: nimroute.env
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
    ports:
      - "3000:3000"
    depends_on:
      litellm:
        condition: service_healthy
    restart: unless-stopped
    networks: [nimroute]

networks:
  nimroute:
    driver: bridge

volumes:
  pgdata:
  redisdata:
