model_list:
  - model_name: deepseek-v4-flash
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-flash
      api_key: os.environ/NVIDIA_NIM_API_KEY_1
      allowed_openai_params:
        - reasoning_effort
  - model_name: glm-5.2
    litellm_params:
      model: nvidia_nim/z-ai/glm-5.2
      api_key: os.environ/NVIDIA_NIM_API_KEY_2
      allowed_openai_params:
        - reasoning_effort
  - model_name: deepseek-v4-pro
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-pro
      api_key: os.environ/NVIDIA_NIM_API_KEY_3
      allowed_openai_params:
        - reasoning_effort
  - model_name: minimax-m3
    litellm_params:
      model: nvidia_nim/minimaxai/minimax-m3
      api_key: os.environ/NVIDIA_NIM_API_KEY_4
      allowed_openai_params:
        - reasoning_effort
  - model_name: opencode-go
    litellm_params:
      model: openai/deepseek-v4-flash
      api_key: os.environ/OPENCODE_GO_API_KEY
      allowed_openai_params:
        - reasoning_effort
      api_base: https://opencode.ai/zen/go/v1

router_settings:
  routing_strategy: usage-based-routing
  num_retries: 1
  timeout: 30
  fallbacks:
    - deepseek-v4-flash: [opencode-go]
    - glm-5.2: [opencode-go]
    - deepseek-v4-pro: [opencode-go]
    - minimax-m3: [opencode-go]
  context_window_fallbacks: []
  allowed_fails: 1
  cooldown_time: 60
  retry_after: 5
  retry_policy:
    AuthenticationErrorRetries: 1   # 401/403 -> fail over to next deployment
    BadRequestErrorRetries: 0
    TimeoutErrorRetries: 1
    RateLimitErrorRetries: 2        # 429 -> retry, then cooldown
    InternalServerErrorRetries: 1   # 5xx -> retry, then cooldown

litellm_settings:
  drop_params: false
  request_timeout: 30
  num_retries: 1
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 300
  retry_after: 5
  allowed_fails: 1

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
